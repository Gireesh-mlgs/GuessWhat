<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="iconBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="24" fill="#090d16"/>
  <rect x="1" y="1" width="98" height="98" rx="23" stroke="url(#iconGlow)" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Sound bars -->
  <rect x="18" y="44" width="6" height="20" rx="3" fill="url(#iconGlow)" opacity="0.6"/>
  <rect x="30" y="30" width="6" height="42" rx="3" fill="url(#iconGlow)" opacity="0.8"/>
  <rect x="42" y="18" width="6" height="64" rx="3" fill="url(#iconGlow)"/>
  <rect x="54" y="28" width="6" height="46" rx="3" fill="url(#iconGlow)" opacity="0.85"/>
  <rect x="66" y="40" width="6" height="28" rx="3" fill="url(#iconGlow)" opacity="0.7"/>
  <rect x="78" y="48" width="6" height="14" rx="3" fill="url(#iconGlow)" opacity="0.5"/>

  <!-- Sprint Lightning Bolt Strike -->
  <path d="M58 10 L30 52 L48 52 L34 90 L76 42 L56 42 Z" fill="url(#iconGlow)" filter="url(#iconBlur)"/>
</svg>
