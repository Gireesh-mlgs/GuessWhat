<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Soundwave / Sprint Bolt Icon -->
  <g transform="translate(10, 10)">
    <!-- Equalizer Sound Bars -->
    <rect x="5" y="42" width="6" height="16" rx="3" fill="url(#neonGlow)" opacity="0.7"/>
    <rect x="15" y="28" width="6" height="34" rx="3" fill="url(#neonGlow)" opacity="0.85"/>
    <rect x="25" y="14" width="6" height="52" rx="3" fill="url(#neonGlow)"/>
    <rect x="35" y="22" width="6" height="40" rx="3" fill="url(#neonGlow)" opacity="0.9"/>
    <rect x="45" y="36" width="6" height="24" rx="3" fill="url(#neonGlow)" opacity="0.8"/>
    
    <!-- Sprint Lightning Dynamic Strike -->
    <path d="M48 6 L26 44 L40 44 L28 74 L62 34 L46 34 Z" fill="#38bdf8" filter="url(#glow)" opacity="0.9"/>
    <path d="M48 6 L26 44 L40 44 L28 74 L62 34 L46 34 Z" fill="url(#neonGlow)"/>
  </g>

  <!-- Typography -->
  <text x="95" y="62" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="-1.5" fill="#ffffff">
    SONG<tspan fill="url(#neonGlow)">SPRINT</tspan>
  </text>
  
  <circle cx="370" cy="38" r="4" fill="#ec4899" filter="url(#glow)"/>
</svg>
